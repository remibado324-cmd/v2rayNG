name: Remi VPN APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup GoMobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $HOME/go/bin/gomobile init

      - name: Rendre gradlew executable
        run: |
          find . -name "gradlew" -type f -exec chmod +x {} \;
          find . -name "gradlew" -type f

      - name: Générer un APK
        run: |
          GRADLE=$(find . -name "gradlew" -type f | head -n 1)
          echo "Je build avec: $GRADLE"
          $GRADLE assembleDebug --stacktrace

      - name: Téléverser un APK
        uses: actions/upload-artifact@v4
        with:
          name: Remi-VPN-APK
          path: '**/build/outputs/apk/debug/*.apk'
